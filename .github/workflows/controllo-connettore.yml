name: Controllo connettore NTS

# Ogni 10 minuti chiede allo shop se il connettore NTS (in LAN) si è fatto sentire.
# Se tace da più di 5 minuti lo shop manda l'email all'ufficio (al massimo una all'ora).
# Serve perché lo shop non ha processi in background: senza questo l'allarme partirebbe
# solo alla conferma di un ordine o all'apertura del cruscotto.
# Richiede i segreti del repo APP_URL e CRON_SECRET (lo stesso CRON_SECRET va al Worker:
# lo copia il workflow cloudflare.yml). Se mancano, il controllo viene saltato.
# Nota: GitHub può ritardare gli avvii programmati di qualche minuto.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: controllo-connettore
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chiama lo shop
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL o CRON_SECRET mancanti nei segreti del repo: salto."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/connettore"
          echo
