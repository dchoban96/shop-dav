name: Build e deploy su Cloudflare

# Il progetto si compila su Linux (workerd non esiste per Windows ARM64).
# La build gira sempre; il deploy solo su main e solo se nel repo ci sono i segreti di Cloudflare.
# Le variabili del Worker stanno nei segreti di GitHub e vengono copiate su Cloudflare a ogni deploy.

on:
  push:
    branches: [main, cloudflare]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pubbliche per definizione: servono anche in build
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build per Cloudflare
        run: npm run build:vinext

      - name: Deploy su Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        run: npm run deploy:vinext

      - name: Variabili del Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DEMO_CODICI_CLIENTE: ${{ secrets.DEMO_CODICI_CLIENTE }}
          APP_URL: ${{ secrets.APP_URL }}
          EMAIL_ORDINI: ${{ secrets.EMAIL_ORDINI }}
          EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node -e '
            const nomi = ["NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_ANON_KEY","SUPABASE_SERVICE_ROLE_KEY","AUTH_SECRET","DEMO_CODICI_CLIENTE","APP_URL","EMAIL_ORDINI","EMAIL_MITTENTE","RESEND_API_KEY","ADMIN_PASSWORD","CRON_SECRET"];
            const o = {};
            for (const n of nomi) if (process.env[n]) o[n] = process.env[n];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/segreti.json", JSON.stringify(o));
            console.log("Variabili presenti: " + Object.keys(o).join(", "));
          '
          if [ "$(cat "$RUNNER_TEMP/segreti.json")" = "{}" ]; then
            echo "Nessuna variabile da copiare: salto."
          else
            npx --yes wrangler secret bulk "$RUNNER_TEMP/segreti.json" --name shop-dav
          fi
          rm -f "$RUNNER_TEMP/segreti.json"
